proposed_validation_split:
  status: "APPROVED - NOT MATERIALIZED"
  source_partition: "Official training partition only"
  official_test_partition_usage: "Held out unchanged for final testing"
  target_fraction: 0.20
  method:
    - >-
      Exclude the two documented copy filenames from split membership without
      deleting or modifying them.
    - >-
      Group exact duplicate source-image hashes and any approved acquisition or
      near-duplicate groups so that a group cannot cross train and validation.
    - >-
      Stratify groups by binary annotation disposition where group integrity
      permits.
    - >-
      Order groups by SHA-256 of the UTF-8 string
      KSDD2-validation-v1|<canonical-group-id> and select the first 20 percent
      of each stratum for validation; assign the remainder to training.
    - "Freeze sample IDs, hashes, method version, and membership before training."
  seed_configuration: "KSDD2-validation-v1"
  constraints:
    - "Stratify by positive and negative annotation status."
    - "Keep exact duplicates and approved acquisition groups in one partition."
    - "Never use official test data for fitting, threshold tuning, model selection, early stopping, or preprocessing decisions."

limitations:
