integrity:
  all_png_files_readable: true
  unreadable_png_count: 0
  canonical_missing_annotation_count: 0
  canonical_orphan_annotation_count: 0
  cross_partition_exact_input_image_duplicate_hashes: 0
  cross_partition_exact_annotation_duplicate_hashes: 16
  annotation_duplicate_interpretation: >-
    Sixteen annotation byte hashes occur in both partitions. No corresponding
    source image hash crosses partitions; repeated binary masks alone do not
    establish duplicate inspection images.
  official_partition_identification:
    training_directory: "train"
    test_directory: "test"
  count_comparison: >-
    Canonical observed counts match official documentation exactly after the
    two exact publisher-archive copy files are identified and excluded from
    sample membership. The original archive and extracted files remain
    unchanged.

proposed_validation_split:
  status: "APPROVED - NOT MATERIALIZED"
  source_partition: "Official training partition only"
  official_test_partition_usage: "Held out unchanged for final testing"
  target_fraction: 0.20
  method:
    - >-
      Exclude the two documented copy filenames from split membership without
      deleting or modifying them.
    - >-
      Group exact duplicate source-image hashes and any approved acquisition or
      near-duplicate groups so that a group cannot cross train and validation.
    - >-
      Stratify groups by binary annotation disposition where group integrity
      permits.
    - >-
      Order groups by SHA-256 of the UTF-8 string
      KSDD2-validation-v1|<canonical-group-id> and select the first 20 percent
      of each stratum for validation; assign the remainder to training.
    - "Freeze sample IDs, hashes, method version, and membership before training."
  seed_configuration: "KSDD2-validation-v1"
  constraints:
    - "Stratify by positive and negative annotation status."
    - "Keep exact duplicates and approved acquisition groups in one partition."
    - "Never use official test data for fitting, threshold tuning, model selection, early stopping, or preprocessing decisions."

limitations:
  - "Images represent one controlled industrial production context."
  - "Lighting, material, camera, and product diversity are limited."
  - "The binary classes are substantially imbalanced."
  - "Physical location cannot be inferred without separate calibration."
  - "The archive contains two redundant copy files in the training directory."
  - "Auxiliary pickle files were identified but not executed or trusted as code."

