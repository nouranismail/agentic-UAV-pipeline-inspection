approval_gates:
  gate_1_scope_ecr:
    authority: "Project Owner / Approval Authority"
    required_before: "requirements or architecture work"
  gate_2_requirements:
    authority: "Project Owner / Approval Authority"
    required_before: "implementation-plan approval"
  gate_3_implementation_plan:
    authority: "Project Owner / Approval Authority"
    required_before: "repository artifact modification"
  gate_4_implementation_evidence:
    authority: "AI & Algorithm Developer"
    meaning: "developer evidence complete; not independent verification or final acceptance"
  gate_5_independent_verification:
    authority: "Independent Verification & Validation Engineer"
    decisions:
      - "PASS"
      - "PASS WITH OBSERVATIONS"
      - "FAIL / CORRECTIVE ACTION REQUIRED"
  gate_6_final_acceptance:
    authority: "Project Owner / Approval Authority"
    required_before: "release or baseline claim"

environment:
  os: "Windows"
  core_toolchain:
    - MATLAB
    - Simulink
    - Stateflow
