  require_explicit_gate_approval: true
  silence_is_approval: false
  enforce_sldd_where_applicable: true
  enforce_traceability: true
  disclose_ai_assistance: true
  invalidate_review_if_candidate_changes: true
  safety_override_priority: "Project-defined safety responses override routine behavior"
  approval_record_fields:
    - approver_name
    - approver_role
    - decision
    - date
    - approved_scope
    - conditions_or_deviations
